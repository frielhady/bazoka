<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bazooka</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo"><h1>Bazooka</h1></div>

      <nav class="main-nav">
        <a href="#">Home</a>
        <a href="#heero">Menu</a>

        <button id="open-cart" class="cart-button" type="button">
          🛒 Cart <span id="cart-count">0</span>
        </button>

        <div class="country-choice">
          <select id="country" aria-label="Choose country">
            <option value="" selected disabled>Choose Country</option>
            <option value="Egypt">Egypt</option>
            <option value="Saudi Arabia">Saudi Arabia</option>
            <option value="UAE">UAE</option>
          </select>
        </div>

        <div class="profile-choice">
          <button
            id="profile-button"
            type="button"
            aria-expanded="false"
            aria-controls="profile-menu"
          >
            👤 Profile
          </button>

          <div id="profile-menu" class="profile-menu">
            <div class="profile-header">
              <div class="profile-icon">👤</div>
              <div>
                <h3>My Profile</h3>
                <p>Bazooka Customer</p>
              </div>
            </div>

            <hr />

            <div class="profile-details">
              <p><strong>Name:</strong> Farida</p>
              <p>
                <strong>Country:</strong>
                <span id="profile-country">Egypt</span>
              </p>
            </div>

            <hr />

            <a href="#" id="orders-link">📦 Orders</a>
            <a href="#" id="favorites-link">⭐ Favorites</a>
            <button id="logout-button" class="logout" type="button">
              Log Out
            </button>
            <button id="close-profile" class="close-profile" type="button">
              Close
            </button>
          </div>
        </div>
      </nav>
    </header>

    <!-- Overlay for the cart -->
    <div id="cart-overlay" class="cart-overlay"></div>

    <!-- Shopping Cart -->
    <aside id="cart" class="cart" aria-label="Shopping cart">
      <div class="cart-header">
        <h2>Shopping Cart</h2>
        <button id="close-cart" type="button" aria-label="Close cart">
          &times;
        </button>
      </div>

      <div id="cart-items" class="cart-items">
        <p class="empty-cart">Your cart is empty</p>
      </div>

      <div class="cart-footer">
        <div class="total">
          <span>Total</span>
          <strong><span id="cart-total">0</span> EGP</strong>
        </div>
        <button class="checkout-btn" type="button">Checkout</button>
      </div>
    </aside>

    <!-- Search -->
    <div class="search-box">
      <input
        type="text"
        id="search"
        placeholder="Search for food..."
        aria-label="Search for food"
      />
      <button id="search-btn" type="button">Search</button>
    </div>

    <!-- Branch Info -->
    <div class="branch">
      <span>Current branch Bazooka</span>
      <a href="#" id="change-branch">Change</a>
    </div>

    <!-- Categories -->
    <nav class="categories" aria-label="Food categories">
      <button type="button" class="active" data-category="offers">
        Offers
      </button>
      <button type="button" data-category="chicken">Chicken Sandwich</button>
      <button type="button" data-category="beef">Beef Sandwich</button>
      <button type="button" data-category="family">Family Meal</button>
      <button type="button" data-category="meals">Meals</button>
      <button type="button" data-category="extras">Extras</button>
      <button type="button" data-category="appetizers">Appetizers</button>
      <button type="button" data-category="drinks">Soft Drinks</button>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="heero">
      <div>
        <h2>CRISPY CHICKEN</h2>
        <p>Delicious chicken, fresh and crispy!</p>
        <button type="button">Order Now</button>
      </div>
      <img src="./The Best Fried Chicken.jpg" alt="Crispy Chicken" />
    </section>

    <!-- Products are displayed here when a category is selected -->
    <section class="offers" id="category-heading">
      <h2>🔥 Today's Offers</h2>
    </section>
    <section
      class="products-container"
      id="products-container"
      aria-label="Menu products"
    ></section>

    <script src="./main.js"></script>
  </body>
</html>
